name: Build APK CDEJ TG 0541

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Construire le pont Android (partage de fichiers)
        run: npm run build

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx capacitor-assets generate --android

      - name: Autoriser l'appareil photo (photos des enfants)
        run: | sed -i 's#</manifest># <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml 
      - name: Synchroniser le contenu web
        run: npx cap sync android

      - name: Numéro de version
        run: | sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle 
      - name: Clé de signature fixe (permet les mises à jour sans perdre les données)
        run: | mkdir -p ~/.android cp signing/debug.keystore ~/.android/debug.keystore 
      - name: Compiler l'APK
        run: | cd android chmod +x gradlew ./gradlew assembleDebug 
      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CDEJ-TG-0541.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CDEJ-TG-0541
          path: CDEJ-TG-0541.apk

      - name: Publier dans Releases (téléchargement facile sur téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CDEJ TG 0541 — version ${{ github.run_number }}
          files: CDEJ-TG-0541.apk
